[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "affective-bridge"
version = "0.1.0"
description = "A privacy-sovereign middleware for forensic emotional inference and affective computing."
readme = "README.md"
authors = [
  { name="Marina Kaličanin" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.urls]
"Homepage" = "https://github.com/AetherMarina/affective-bridge"
"Bug Tracker" = "https://github.com/AetherMarina/affective-bridge/issues"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.setuptools.packages.find]
include = ["affective_bridge*"]